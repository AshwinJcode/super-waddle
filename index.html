<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Notes</title>
<meta name="description" content="Complete Java notes">
<link rel="stylesheet" href="css/style.css">
<script defer src="js/app.js"></script>
</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Toggle topics" aria-controls="nav">☰</button>
  <div class="logo" aria-hidden="true">J</div>
  <h1>Java Notes</h1>
</header>
<div class="layout">
  <nav id="nav" aria-label="Topics"></nav>
  <main id="main">
    <p class="section-label" id="section-label"></p>
    <h2 class="topic-title" id="topic-title"></h2>
    <p class="topic-sub" id="topic-sub"></p>
    <section class="code-block" id="code-block" aria-label="Example code">
      <div class="code-block-head">
        <span id="filename"></span>
        <button class="copy-btn" id="copyBtn" type="button">Copy</button>
      </div>
      <pre><code id="code-content"></code></pre>
    </section>
    <article class="explain" id="explain"></article>
    <div class="nav-footer">
      <button id="prev-btn" type="button"></button>
      <button id="next-btn" type="button"></button>
    </div>
  </main>
</div>
<noscript><p style="padding:20px">This site needs JavaScript enabled to show the notes.</p></noscript>
</body>
</html>
